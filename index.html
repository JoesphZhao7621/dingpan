<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 强制声明使用 UTF-8 编码，防止中文乱码 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字资产命名生成器 (专业版)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --border: #dcdfe6;
            --danger: #e53e3e;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg); color: var(--primary); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max		max-width: 600px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; text-align: center; color: var(--primary); margin-bottom: 30px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        h3 { font-size: 16px; background: #edf2f7; padding: 8px 12px; border-left: 4px solid var(--accent); margin: 25px 0 15px 0; color: #2c3e50; }
        
        .section { margin-bottom: 20px; }
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #60626	6; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        /* 中标提醒样式 */
        .checkbox-group { display: flex; align-items: center; background: #fff5f5; padding: 12px; border-radius: 6px; border: 1px solid #feb2b2; margin-top: 10px; }
        .checkbox-group input { width: auto; margin-	right: 10px; cursor: pointer; }
        .checkbox-string { font-size: 13px; color: var(--danger); font-weight: bold; }

        .result-card { margin-top: 30px; padding: 20px; background: #2c3e50; border-radius: 8px; color: white; position: relative; }
        #finalFileName { font-family: 'Courier New', monospace; font-size: 16px; line-height: 1.5; word-break: break-all; display: block; margin-bottom: 15px; color: #ecf0f1; min-height: 40px; }
        .copy-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .copy-btn:active { transform: scale(0.98); }
        
        .badge { font-size: 1	0px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #fff; float: right; letter-spacing: 1px; }
        
        @media (max-width: 480px) { .grid-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>数字资产命名生成器</h1>

    <!-- 第一阶段 -->
    <h3>第一阶段：项目身份证 (文件夹编号)</h3>
    <div class="section">
        <div class="grid-row">
            <div class="form-group">
                <label>年份</label>
                <input type="text" id="year" value="2026">
            </div>
            <div class="form-group">
                <label>流水号</label>
                <input type="text" id="serial" value="001">
            </div>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>区域代码</label>
                <select id="region">
                    <option value="GD">GD (广东)</option>
                    <option value="EC">EC (华东)</option>
                    <option value="ZB" selected>ZB (总部直属)</option>
                </select>
            </div>
            <div class="form-group">
                <label>项目类型</label>
                <select id="projectType">
                    <option value="BG" selected>BG (办公/产业园)</option>
				    <option value="YL">YL (医养领域)</option>
					<option value="SY">SY (商业/酒店)</option>
					<option value="MQ">MQ (幕墙工程)</option>
					<option value="SFQ">SFQ (示范区)</option>
					<option value="ZZ">ZZ (住宅大货)</option>
					<option value="HS">HS (会所)</option>
					<option value="LX">LX (零星工程)</option>
                </select>
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="isWon" onchange="generate()">
            <span class="checkbox-string">项目已中标 (自动添加 [Z] 前缀)</span>
        </div>
    </div>

    <!-- 第二阶段 -->
    <h3>第二阶段：资产文件名 (舱内文件)</h3>
    <div class="section">
        <div class="form-group">
            <label>所属资产舱 (Pod Code)</label>
            <select id="podCode" onchange="generate()">
                <option value="ZB">ZB (招标原始舱)</option>
				<option value="TB" selected>TB (投标成果舱) <!-- 已按要求添加 --></option>
				<option value="CB">CB (成本底稿舱)</option>
				<option value="FK">FK (结果反馈舱)</option>
            </select>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>舱内顺序号 (如: 01)</label>
                <input type="text" id="seqNo" value="0	01">
            </div>
            <div class="form-group">
                <label>状态/版本 (如: [定稿])</label>
                <input type="text" id="suffix" value="[定稿]">
            </div>
        </div>
        <div class="form-group">
            <label>文件内容描述</label>
            <input type="text" id="description" placeholder="例如: 招标图纸-建筑装修" value="招标图纸-建筑装修">
        </div>
	</div>

    <!-- 结果展示 -->
    <div class="result-card">
        <span class="badge">RESULT</span>
        <div id="finalFileName">正在生成...</div>
        <button class="copy-btn" onclick="copyToClipboard()">复制文件名</button>
    </div>
</div>

<script>
    function generate() {
        try {
            const year = document.getElementById('year').value;
            const region = document.getElementById('region').value;
            const type = document.getElementById('projectType').value;
            const serial = document.getElementById('serial').value;
            const isWon = document.getElementById('isWon').checked;

            // 1. 构建项目 ID: 年份-区域-类型-流水 (例如 2026-GD-BG-001)
            let projectId = year + '-' + region + '-' + type + '-' + serial;
            if (isWon) {
                projectId = '[Z]' + projectId;
            }

            // 2. 获取文件属性
            const podCode = document.getElementById('podCode').value;
            const seqNo = document.getElementById('seqNo').value;
            const description = document.getElementById('description').value;
            const suffix = document.getElementById('suffix').value;

            // 3. 按照“嵌套式命名法”拼接: 项目ID-舱代码-顺序号-描述 [状态]
            let finalName = projectId + '-' + podCode + '-' + seq				seqNo + '-' + description;
            if (suffix) {
                finalName += ' ' + suffix;
            }

            document.getElementById('finalFileName').innerText = finalName;
        } catch(e) {
            console.error("生成错误: ", e);
        }
    }

    // 初始化执行一次
    window.onload = generate;

    // 监听所有输入变化
    document.querySelectorAll('input, select').forEach(el => { 
        el.addEventListener('input', generate); 
    });

    // 复制功能
    function copyToClipboard() {
        const text = document.getElementById('finalFileName').innerText;
        navigatorary.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.copy-btn');
            const oldText = btn.innerText;
            btn.innerText = "✅ 复制成功！";
            btn.style.backgroundColor = "#27ae60";
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.backgroundColor = "#3498db";
            }, 1500);
        }).catch(err => {
            alert("复制失败，请手动选择文字复制");
        });
    }
</script>

</body>
</html>
