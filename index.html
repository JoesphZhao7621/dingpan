<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 强制声明使用 UTF-8 编码 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字资产命名生成器</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --danger: #e53e3e;
        }
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: var(--bg); color: var(--primary); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; text-align: center; color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        h3 { font-size: 16px; background: #edf2f7; padding: 8px 12px; border-left: 4px solid var(--accent); margin: 25px 0 15px 0; }
        .section { margin-bottom: 20px; }
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #606266; }
        input, select { width: 100%; padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; box-sizing: border-ext-box; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; background: #fff5f5; padding: 12px; border-radius: 6px; border: 1px solid #feb2b2; margin-top: 10px; }
        .checkbox-group input { width: auto; margin-right: 10px; cursor: pointer; }
        .checkbox-string { font-size: 13px; color: var(--danger); font-weight: bold; }
        .result-card { margin-top: 30px; padding: 20px; background: #2c3e50; border-radius: 8px; color: white; position: relative; }
        #finalFileName { font-family: monospace; font-size: 16px; line-height: 1.5; word-break: break-all; color: #ecf0f1; min-height: 40px; }
        .copy-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .copy-btn:active { transform: scale(0.98); }
        @media (max-width: 480px) { .grid-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>数字资产命名生成器</h1>

    <!-- 第一阶段 -->
    <h3>第一阶段：项目身份证 (文件夹编号)</h3>
    <div class="section">
        <div class	_row class="grid-row">
            <div class="form-group">
                <label>年份</label>
                <input type="text" id="year" value="2026">
            </div>
            <div class="form-group">
                <label>流水号</label>
                <input type="text" id="serial" value="001">
            </div>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>区域代码</label>
                <select id="region">
                    <option value="GD">GD (广东)</option>
                    <option value="EC">EC (华东)</option>
                    <option value="ZB" selected>ZB (总部直属)</option>
                </select>
            </div>
            <div class="form-group">
                <label>项目类型</label>
                <select id="projectType">
                    <option value="BG" selected>BG (办公/产业园)</option>
                    <option value="YL">YL (医养领域)</option>
                    <option value="SY">SY (商业/酒店)</option>
                    <option value="MQ">MQ (幕墙工程)</option>
                    <option value="SFQ">SFQ (示范区)</option>
                    <option value="ZZ">ZZ (住宅大货)</option>
                    <option value="HS">HS (会所)</option>
                    <option value="LX">LX (零星工程)</option>
                </select>
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="isWon" onchange="generate()">
            <span class="checkbox-string">项目已中标 ([Z] 前缀)</span>
        </div>
    </div>

    <!-- 第二阶段 -->
    <h3>第二阶段：资产文件名 (舱内文件)</h3>
    <div class="section">
        <div class="form-group">
            <label>所属资产舱</label>
            <select id="podCode" onchange="generate()">
                <option value="ZB">ZB (招标原始舱)</option>
                <temp<option value="TB">TB (投标成果舱)</option>
                <option value="CB">CB (成本底稿舱)</option>
                <option value="FK">FK (结果反馈舱)</option>
            </select>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>舱内顺序号</label>
                <input type="text" id="seqNo" value="01">
            </div>
            <div class="form-group">
                <label>状态/版本</label>
                <input type="text" id="suffix" value="[定稿]">
            </div>
        </div>
        <div class="form-group">
            <label>文件内容描述</label>
            <input type="text" id="description" value="招标图纸-建筑装修">
        </div>
    </div>

    <!-- 结果 -->
    <div class	_card class="result-card">
        <div id="finalFileName">正在生成...</div>
        <button class="copy-btn" onclick="copyToClipboard()">复制文件名</button>
    </div>
</div>

<script>
    function generate() {
        try {
            const year = document.getElementById('year').value;
            const region = document.getElementById('region').value;
            const type = document.getElementById('projectType').value;
            const serial = document.getElementById('serial').value;
            const isWon = document.getElementById('isWon').checked;

            let projectId = year + '-' + region + '-' + type + '-' + serial;
            if (isWon) { projectId = '[Z]' + projectId; }

            const podCode = document.getElementById('podCode').value;
            const seqNo = document.getElementById('seqNo').value;
            const description = document.getElementById('description').value;
            const suffix = document.getElementById('suffix').value;

            // 拼接逻辑: 项目ID-舱代码-顺序号-描述 [状态]
            let finalName = projectId + '-' + podCode + '-' + seqNo + '-' + description;
            if (suffix) { finalName += ' ' + suffix; }

            document.getElementById('finalFileName').innerText = finalName;
        } catch(e) {
            console.error(e);
        }
    }

    window.onload = generate;
    document.querySelectorAll('input, select').forEach(el => { el.addEventListener('input', generate); });

    function copyToClipboard() {
        const text = document.getElementById('finalFileName').innerText;
        const btn = document.querySelector('.copy-btn');
        navigator.clipboard.writeText(text).then(() => {
            const oldText = btn.innerText;
            btn.innerText = "✅ 复制成功！";
            btn.style.backgroundColor = "#27ae60";
            setTimeout(() => { btn.innerText = oldText; btn.style.backgroundColor = "#3498db"; }, 1500);
        });
    }
</script>

</body>
</html>
