<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 强制声明使用 UTF-8 编码，防止中文乱码 -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字资产命名专业生成器</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
            --border: #dcdfe6;
            --danger: #e53e3e;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; padding: 15px; }
        .container { background: white; width: 100%; max-width: 600px; margin: 0 auto; padding: 20	px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); box-sizing: border-box; }
        h1 { font-size: 20px; text-align: center; color: var(--primary); margin-bottom: 25px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        h3 { font-size: 15px; background: #edf2f7; padding: 8px 12px; border-left: 4px solid var(--accent); margin: 20px 0 10px 0; color: #2c3e50; }
        
        .section { margin-bottom: 15px; }
        .grid-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .form-group { flex: 1; min-width: 140px; margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #606266; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
        
        .checkbox-group { display: flex; align-items: center; background: #fff5f5; padding: 12px; border-radius: 6px; border: 1px solid #feb2b2; margin-top: 10px; }
        .checkbox-group input { width: auto; margin-right: 10px; transform: scale(1.2); }
        .checkbox-string { font-size: 13px; color: var(--danger); font-weight: bold; }

        .result-card { margin-top: 25px; padding: 20px; background: #2c3e50; border-radius: 8px; color: white; position: relative; word-break: break-all; }
        #finalFileName { font-family: monospace; font-size: 16px; line-height: 1.5; color: #ecf0f1; margin-bottom: 15px; display: block; }
        .copy-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .copy-btn:active { background: #2980b9; transform: scale(0.98); }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.2); color: #fff; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>数字资产命名生成器</h1>

    <!-- 第一阶段 -->
    <h3>第一阶段：项目身份证 (文件夹编号)</h3>
    <div class="section">
        <div class="grid-row">
            <div class="form-group">
                <label>年份</label>
                <input type="text" id="year" value="2026">
            </div>
            <div class="form-group">
                <label>流水号</label>
                <input type="text" id="serial" value="001">
            </div>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>区域代码</label>
                <select id="region">
                    <option value="GD">GD (广东)</option>
                    <option value="EC">EC (华东)</option>
                    <option value="ZB" selected>ZB (总部直属)</option>
                </select>
            </div>
            <div class="form-group">
                <label>项目类型</label>
                <select id="projectType">
                    <option value="BG" selected>BG (办公/产业园)</option>
                    <option value="YL">YL (医养领域)</option>
                    <option value="SY">SY (商业/酒店)</option>
                    <option value="MQ">MQ (幕墙工程)</option>
                    <option value="SFQ">SFQ (示范区)</option>
                    <option value="ZZ">ZZ (住宅大货)</option>
                    <option value="HS">HS (会所)</para>
                    <option value="LX">LX (零星工程)</option>
                </select>
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="isWon" onchange="generate()">
            <span class="checkbox-string">项目已中标 ([Z] 前缀)</span>
        </div>
    </div>

    <!-- 第二阶段 -->
    <h3>第二阶段：资产文件名 (舱内文件)</h3>
    <div class="section">
        <div class="form-group">
            <label>所属资产舱</label>
            <select id="podCode" onchange="generate()">
                <option value="ZB">ZB (招标原始舱)</option>
                <option value="TB">TB (投标成果舱)</option>
                <option value="CB">CB (成本底稿舱)</option>
                <option value="FK">FK (结果反馈舱)</option>
            </select>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>舱内顺序号</label>
                <input type="text" id="seqNo" value="01">
            </div>
            <div class="</strong>form-group">
                <label>状态/版本</label>
                <input type="text" id="suffix" value="[定稿]">
            </div>
        </div>
        <div class="form-group">
            <label>文件内容描述</label>
            <input type="text" id="description" value="招标图纸-建筑装修">
        </div>
    </div>

    <!-- 结果 -->
    <div class="result-card">
        <span class="badge">RESULT</span>
        <div id="finalFileName">正在生成...</div>
        <button class="copy-btn" onclick="copyToClipboard()">复制文件名</button>
    </div>
</div>

<script>
    function generate() {
        try {
            // 1. 获取项目基础信息
            const year = document.getElementById('year').value;
            const region = document.getElementById('region').value;
            const type = document.getElementById('projectType').value;
            const serial = document.getElementById('serial').value;
            const isWon = document.getElementById('isWon').checked;

            let projectId = year + '-' + region + '-' + type + '-' + serial;
            if (isWon) { projectId = '[Z]' + projectId; }

            // 2. 获取文件信息
            const podCode = document.getElementById('podCode').value;
            const seqNo = document.getElementById('seqNo').value;
            const description = document.getElementById('description').value;
            const suffix = document.getElementById('suffix').value;

            // 3. 拼接逻辑: 项目ID-舱代码-顺序号-描述 [状态]
            let finalName = projectId + '-' + podCode + '-' + seqNo + '-' + description;
            if (suffix) { finalName += ' ' + suffix; }

            document.getElementById('finalFileName').innerText = finalName;
        } catch (e) {
            console.error("Generation Error:", e);
        }
    }

    // 初始化并绑定事件
    window.onload = generate;
    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', generate);
    });

    function copyToClipboard() {
        const text = document.getElementById('finalFileName').innerText;
        if (!text || text === "正在生成...") return;
                
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.copy-btn');
            const oldText = btn.innerText;
            btn.innerText = "✅ 复制成功！";
            btn.style.backgroundColor = "#27ae60";
            setTimeout(() => { 
                btn.innerText = oldText; 
                btn.style.backgroundColor = "#3498db"; 
            }, 1500);
        }).catch(err => {
            // 兼容性降级方案：如果 Clipboard API 不支持（旧版微信），则使用传统方法
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert("已复制到剪贴板！");
            } catch (err) {
                alert("复制失败，请手动长按文字复制");
            }
            document.body.removeChild(textArea);
        });
    }
</script>

</body>
</html>
