<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钉盘数字资产命名专业生成器 (投标版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --border-color: #dcdfe6;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: var(--bg-color); color: var(--primary-color); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 650px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; text-align: center; color: var(--primary-color); margin-bottom: 30px; border-bottom: 3px solid var(--accent-color); padding-bottom: 10px; }
        h3 { font-size: 16px; background: #edf2f7; padding: 8px 12px; border-left: 4px solid var(--accent-color); margin: 25px 0 15px 0; }
        
        .section { margin-bottom: 20px; }
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5																															            0px; color: #606266; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        .checkbox-group { display: flex; align-items: center; background: #fdf6ec; padding: 10px; border-radius: 6px; border: 1px solid #faecd8; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        .checkbox-string { font-size: 13px; color: #e67e22; font-weight: bold; }

        .result-card { margin-top: 30px; padding: 20px; background: #2c3e50; border-radius: 8px; color: white; position: relative; }
        #finalFileName { font-family: 'Courier New', monospace; font-size: 16px; line-height: 1.5; word-break: break-all; display: block; margin-bottom: 15px; color: #ecf0f1; }
        .copy-btn { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .copy-btn:hover { background: #2980b9; transform: translateY(-2px); }
        
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #eee; color: #666; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>数字资产命名专业生成器 <span style="font-size: 12px; font-weight: normal;">(投标/实施全生命周期)</span></h1>

    <!-- 第一阶段：项目文件夹编号 (Project ID Builder) -->
    <h3>第一阶段：构建“项目身份证” (文件夹编号)</h3>
    <div class="section">
        <div class="grid-row">
            <div class="form-group">
                <label>年份 (4位)</label>
                <input type="text" id="year" placeholder="2026" value="2026">
            </div>
            <div class="form-group">
                <lib>流水号 (3位)</label>
                <input type="text" id="serial" placeholder="001" value="001">
            </div>
        </div>
        <div class="grid-row">
            <div class="form-group">
                <label>区域/部门代码</label>
                <select id="region">
                    <option value="GD">GD (广东)</option>
                    <option value="EC">EC (华东)</option>
                    <option value="ZB" selected>ZB (总部直属)</option>
                </select>
            </div>
            <div class="form-group">
                <label>项目类型代码</label>
                <select id="projectType">
                    <option value="BG" selected>BG (办公/产业园)</option>
                    <option value="YL">YL (医养领域)</option>
                    <option value="SY">SY (商业/酒店)</option>
                    <option value="MQ">MQ (幕墙工程)</option>
                </select>
            </div>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="isWon" onchange="generate()">
            <span class="checkbox-string">项目已中标 (自动添加 [Z] 前缀)</span>
        </div>
    </div>

    <!-- 第二阶段：文件命名 (File Name Builder) -->
    <h3>第二阶段：构建“资产文件名” (舱内文件)</h3>
    <div class="section">
        <div class="form-group">
            <label>所属资产舱 (Pod Code)</label>
            <select id="podCode" onchange="generate()">
                <option value="ZB">ZB (招标原始舱 - 记录原件)</option>
                <option value="TB">TB (投标成果舱 - 最终定稿)</option>
                <option value="CB">CB (成本底稿舱 - 高机密区)</option>
                <option value="FK">FK (结果反馈舱 - 复盘增值)</option>
            </select>
        </div>
        <div class="form-group">
            <label>舱内顺序号 (如: 01, 02)</label>
            <input type="text" id="seqNo" placeholder="01" value="01">
        </div>
        <div class="form-group">
            <label>文件内容描述</label>
            <input type="text" id="description" placeholder="例如: 招标图纸-建筑装修" value="招标图纸-建筑装修">
        </div>
        <div class="form-group">
            <label>状态/版本后缀 (如: [盖章版], V1, [定稿])</label>
            <input type="text" id="suffix" placeholder="[盖章版]" value="[定稿]">
        </div>
    </div>

    <!-- 结果展示 -->
    <div class="result-card">
        <span class="badge">RESULT</span>
        <div id="finalFileName">等待生成...</div>
        <button class="copy-btn" onclick="copyToClipboard()">复制文件名</button>
    </div>
</div>

<script>
    function generate() {
        // 1. 获取项目ID部分 (Project ID)
        const year = document.getElementById('year').value;
        const region = document.getElementById('lib')?.value || document.getElementById('region').value;
        const type = document.getElementById('projectType').value;
        const serial = document.getElementById('serial').value;
        const isWon = document.getElementById('isWon').checked;

        let projectId = `${year}-${region}-${type}-${serial}`;
        if (isWon) {
            projectId = `[Z]${projectId}`;
        }

        // 2. 获取文件部分 (File Name)
        const podCode = document.getElementById('podCode').value;
        const seqNo = document.getElementById('seqNo').value;
        const description = document.getElementById('description').value;
        const suffix = document.getElementById('suffix').value;

        // 3. 按照文档公式拼接: 项目ID + 舱代码 + 顺序号 + 描述 + 后缀
        // 根据文档示例: 2026-GD-BG-001-ZB-01-招标公告及招标文件.pdf
        // 注意：此处逻辑统一采用“连字符”连接，确保结构化
        let finalName = `${projectId}-${podCode}-${seqNo}-${description}`;
        
        if (suffix) {
            finalName += ` ${suffix}`;
        }

        document.getElementById('finalFileName').innerText = finalName;
    }

    // 初始化执行一次
    window.onload = generate;

    // 监听所有输入变化
    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', generate);
    });

    // 复制功能
    function copyToClipboard() {
        const text = document.getElementById('finalFileName').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerText;
            btn.innerText = "✅ 已成功复制！";
            btn.style.background = "#27ae60";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "#3498db";
            }, 1500);
        });
    }
</script>

</body>
</html>
